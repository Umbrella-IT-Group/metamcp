name: Umbrella MCP Conformance (umbrella branch)

# Umbrella IT Group fork, see UMBRELLA_FORK.md.
# Runs the official MCP conformance suite (@modelcontextprotocol/conformance,
# pinned in .github/conformance/package-lock.json) against the gateway built from
# this commit, with a small fixture MCP server registered behind it and a
# loopback alias proxy in front (the runner cannot send headers and does not
# know the gateway's `Server__tool` names). Known gaps are listed, each with a
# reason, in .github/conformance/expected-failures.yml; the run goes red on a
# scenario that fails and is not listed, a listed one that now passes, or a
# listed one that fails for a new reason.
#
# NOT a required check, and it must never be made one while it carries `paths:`:
# a path-filtered job never reports on a PR that misses the filter, so a
# required one would block those PRs forever. To promote it, drop `paths:` first
# (about 3 minutes added to every PR) and decide that deliberately.
#
# Run it locally against a throwaway database (see run.sh for the rules):
#   DATABASE_URL=postgresql://user@127.0.0.1:5432/metamcp_test \
#     bash .github/conformance/run.sh
# A red run names its class in the ::error title: BASELINE, HARNESS, REGRESSION,
# REASON CHANGED or LEAK (run.sh explains each).
#
# Owner: the gateway maintainers, who also own the weekly cron and the
# quarterly runner bump. The baseline is currently
# provisional: it is calibrated against the umbrella branch as of the PR that
# added it, and is regenerated once the progress-relay and Origin-policy work
# have merged (expected-failures.yml says the same).
#
# Cost: this repository is public, so the minutes are free; if it ever goes
# private, budget about 3 minutes per run (an estimate, to be measured).
#
# Safety properties, each pinned by a test in
# apps/backend/src/conformance/workflow-guards.test.ts:
#   - pull_request only. No trigger that runs with repository secrets, and no
#     secret is referenced anywhere. The job's own credentials are random,
#     generated per run, and never leave the runner.
#   - The artifact is uploaded only after a scrub step that always runs has
#     explicitly succeeded; a failed or crashed scanner uploads nothing.
#   - The run writes only inside a fresh directory it owns.

on:
  pull_request:
    branches:
      - umbrella
    paths:
      - "apps/backend/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/conformance/**"
      - ".github/workflows/umbrella-conformance.yml"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# A superseded PR run has no residual value; scheduled and manual runs queue.
concurrency:
  group: conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: itest
          POSTGRES_DB: metamcp_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U itest -d metamcp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://itest@127.0.0.1:5432/metamcp_test

    steps:
      # persist-credentials: false keeps the checkout token out of the
      # workspace that the third-party runner can read.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # No `version:` input: the root package.json `packageManager` field stays
      # the single source of truth (same reasoning as umbrella-ci.yml).
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      # The gateway runs on the Node the Dockerfile installs.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Same builds, same reason, as umbrella-ci.yml.
      - run: pnpm --filter @repo/zod-types build
      - run: pnpm --filter @repo/trpc build

      - run: pnpm -C apps/backend exec drizzle-kit migrate
      - run: pnpm -C apps/backend build

      # The production bundle must not contain the harness: its proxy injects a
      # gateway key into every request it forwards. tsup bundles only what
      # src/index.ts reaches, and this proves the built output agrees.
      - name: Check the built bundle is free of the harness
        working-directory: apps/backend
        run: node --import tsx src/conformance/ci-tools.ts check-bundle --dist dist

      - name: Remember the gateway's Node
        run: echo "GATEWAY_NODE=$(command -v node)" >> "$GITHUB_ENV"

      # The conformance runner imports `globSync` from `fs`, which Node 20 lacks.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.1

      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix .github/conformance

      # The PARENT of the run directory, outside the checkout. The run never
      # deletes or writes into this path itself, only into a fresh child it
      # allocates below. Set here because the runner context is not available
      # in a job-level env.
      - name: Choose the output parent
        run: echo "CONFORMANCE_OUT=$RUNNER_TEMP/conformance" >> "$GITHUB_ENV"

      - name: Allocate the run directory
        working-directory: apps/backend
        run: |
          dir="$(node --import tsx src/conformance/ci-tools.ts alloc-run-dir --parent "$CONFORMANCE_OUT" --repo-root "$GITHUB_WORKSPACE")"
          echo "CONFORMANCE_RUN_DIR=$dir" >> "$GITHUB_ENV"

      # Loopback-socket tests of the proxy and the fixture; excluded from the
      # required unit job on purpose.
      - run: pnpm -C apps/backend test:conformance

      - name: Run the conformance suite
        id: harness
        run: bash .github/conformance/run.sh

      # Always runs, and its OUTCOME gates the upload below. Exit 1 is a
      # credential-shaped value in the output (the directory is deleted); exit 2
      # is a scanner that could not look. Either fails the job and blocks the
      # upload. With no run directory at all it exits 2.
      - name: Scrub the results
        id: scrub
        if: ${{ always() }}
        working-directory: apps/backend
        run: >-
          node --import tsx src/conformance/ci-tools.ts scan
          --dir "$CONFORMANCE_RUN_DIR" --remove-on-hit
          --parent "$CONFORMANCE_OUT" --repo-root "$GITHUB_WORKSPACE"

      # Artifacts of a public repository are public. `always()` alone would
      # upload after a failed scrub, so the outcome is checked explicitly.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && steps.scrub.outcome == 'success' }}
        with:
          name: conformance-results
          path: ${{ env.CONFORMANCE_RUN_DIR }}
          if-no-files-found: warn
          retention-days: 14
