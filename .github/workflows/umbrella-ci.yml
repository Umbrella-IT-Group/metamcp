name: Umbrella — Test & Typecheck (umbrella branch)

# Umbrella IT Group fork — see UMBRELLA_FORK.md.
# umbrella-build.yml proves the Dockerfile still produces an image; it has
# never run the test suite or tsc. That gap is not theoretical: a mechanical
# rename landed an identifier with a space in it, the file stopped parsing,
# and a whole file's worth of assertions dropped out of every run with
# nothing anywhere to notice. This workflow is the thing that notices.
#
# Deliberately has NO `paths:` filter, unlike umbrella-build.yml. A required
# status check that is path-filtered never reports at all on a PR that misses
# the filter, and GitHub then blocks that PR forever waiting on a status that
# is never coming. Running on every push/PR is what makes this job safe to
# mark required in branch protection (context name: `test-and-typecheck`).

on:
  push:
    branches:
      - umbrella
  pull_request:
    branches:
      - umbrella
  workflow_dispatch:

# Nothing here publishes, so a superseded run has no residual value — unlike
# the push-to-`umbrella` image build, which queues instead of cancelling so
# every commit keeps its own :sha tag and attestation. Cancelling on both
# paths just stops paying for an answer about a commit nobody is on anymore.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every job declares its own permissions; this default
# covers any job added later without a block.
permissions:
  contents: read

jobs:
  test-and-typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # No `version:` input on purpose. pnpm/action-setup reads the root
      # package.json `packageManager` field when the input is omitted, and
      # hard-errors if an input and that field disagree — so leaving it out
      # keeps the repo's own pin the single source of truth and means a
      # future bump to `packageManager` doesn't silently skip CI. (The
      # Dockerfile installs its own, newer pnpm; that's the image's
      # business, not this job's.)
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Matches the Node the Dockerfile installs (nodesource setup_20.x),
          # so a type or runtime error CI catches is one the image would hit.
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # MANDATORY before anything typechecks or imports, and the reason is
      # not obvious: `@repo/zod-types` and `@repo/trpc` are consumed through
      # their `dist/`, which is gitignored and therefore never present on a
      # fresh checkout, and turbo's `check-types` task does not depend on
      # `^build`. (turbo's `test` task does since 2026-10-22, but the test
      # steps below call vitest directly through `pnpm -C <app> test`,
      # bypassing turbo, so they still need these builds.) Skipping this
      # doesn't fail as "missing build" — it fails as ~30 test files that
      # can't resolve their imports plus a wall of TS2307, which reads like a
      # code break and sends the reader hunting in the wrong place. zod-types
      # first: trpc's types are built against it.
      - run: pnpm --filter @repo/zod-types build
      - run: pnpm --filter @repo/trpc build

      # No DATABASE_URL, and deliberately no TEST_DATABASE_URL either. The
      # postgres integration cases gate themselves on TEST_DATABASE_URL
      # (`describe.skipIf`), so they skip here and every other case runs
      # against no infrastructure at all. Standing up a real database to
      # un-skip them is a separate decision with its own cost, not something
      # to smuggle in behind a unit-test gate. The credential-boundary suites
      # run against one in their own job below, `postgres-integration`.
      - run: pnpm -C apps/backend test
      - run: pnpm -C apps/frontend test

      # Root script — `turbo run check-types` across backend, frontend and
      # @repo/zod-types. `lint` stays out: apps/frontend carries pre-existing
      # eslint warnings that `--max-warnings 0` turns into a hard failure, so
      # gating it today would just make this check permanently red.
      - run: pnpm check-types

  # The Postgres-backed suites that pin the admin-plane credential boundary:
  # the columns a created key is written with, the transaction a key and its
  # audit row share, the row locks that order a create against an owner's
  # disable, and the audit transaction every admin-plane write runs in. They
  # cannot be unit tests: each one is a statement about what a real database
  # does, and with the database removed every one of them passes (the
  # `describe.skipIf` above), so a change that persists an unlocked, public or
  # admin-plane key, or lets a write commit without its audit row, would pass
  # `test-and-typecheck`. This job runs them.
  #
  # A SEPARATE job on purpose, not steps in `test-and-typecheck`: the decision
  # recorded above (a database is not smuggled in behind the unit-test gate)
  # stands, so this one is visible by name and can be made a required check in
  # branch protection as its own decision (context name:
  # `postgres-integration`). Like the job above it has no `paths:` filter, so a
  # required check on it always reports.
  #
  # The service database is a throwaway container bound to the runner with
  # trust authentication and no password, so there is no credential in this
  # file. A skipped test is a failure here: the report is checked below, since
  # a missing or unreachable TEST_DATABASE_URL would otherwise skip every suite
  # and leave the job green.
  postgres-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: itest
          POSTGRES_DB: metamcp_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U itest -d metamcp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://itest@127.0.0.1:5432/metamcp_test
      TEST_DATABASE_URL: postgresql://itest@127.0.0.1:5432/metamcp_test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Same builds, same reason, as in `test-and-typecheck`.
      - run: pnpm --filter @repo/zod-types build
      - run: pnpm --filter @repo/trpc build

      # The real migrator, so a migration that does not apply fails here too.
      - run: pnpm -C apps/backend exec drizzle-kit migrate

      # The file list lives in apps/backend/package.json (`test:integration`).
      - run: >-
          pnpm -C apps/backend test:integration
          --reporter=default --reporter=json
          --outputFile=${{ runner.temp }}/integration-report.json

      # Every suite file ran at least one test, nothing failed, nothing was
      # skipped. `numPendingTests` is vitest's count of skipped tests.
      - run: >-
          jq -e '.numFailedTests == 0 and .numPendingTests == 0
          and .numTotalTests > 0
          and ([.testResults[] | select((.assertionResults | length) == 0)]
          | length) == 0'
          "${{ runner.temp }}/integration-report.json"
