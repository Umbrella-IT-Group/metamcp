services:
  app:
    container_name: metamcp-dev
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    env_file:
      - ../.env
    ports:
      - "12008:12008"
      - "12009:12009"
    volumes:
      # Mount source code for hot reloading with cached performance
      - ..:/workspaces/metamcp:cached
      # Preserve node_modules from image to avoid overwriting with host's node_modules
      # This is critical for devcontainers where host may have different OS/arch
      - /workspaces/metamcp/node_modules
      - /workspaces/metamcp/apps/frontend/node_modules
      - /workspaces/metamcp/apps/backend/node_modules
      - /workspaces/metamcp/packages/trpc/node_modules
      - /workspaces/metamcp/packages/eslint-config/node_modules
      - /workspaces/metamcp/packages/typescript-config/node_modules
    working_dir: /workspaces/metamcp
    # Don't override command - let devcontainer.json handle it (sleep infinity)
    # Users can manually run ./docker-entrypoint-dev.sh when needed
    command: sleep infinity
    environment:
      # POSTGRES_PASSWORD is REQUIRED and deliberately has no fallback: the
      # default this line used to carry is published in this repository, and a
      # devcontainer's Postgres is published on a host port like any other.
      # Compose refuses to render with the message below rather than booting
      # Postgres on a guessable credential.
      #
      # The message names `.devcontainer/.env`, not the repository root's
      # `.env`, because by default compose resolves `.env` for `${...}`
      # interpolation from the project directory, which defaults to the
      # compose file's own folder (overridable via --project-directory or
      # COMPOSE_ENV_FILES). `env_file: ../.env` below is a different
      # mechanism — it passes the root file INTO the container and is not
      # read for substitution here — so the root `.env` alone does not
      # satisfy this by default.
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-metamcp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment or .devcontainer/.env (see example.env)}
      POSTGRES_DB: ${POSTGRES_DB:-metamcp_db}
      
      DATABASE_URL: postgresql://${POSTGRES_USER:-metamcp_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment or .devcontainer/.env (see example.env)}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-metamcp_db}
      
      APP_URL: ${APP_URL:-http://localhost:12008}
      NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:12008}
      
      # Required, no fallback — the session signing key, whose old default is
      # published in this repository. The message names `.devcontainer/.env`
      # for the same reason the POSTGRES_PASSWORD note above does: compose
      # resolves `.env` for `${...}` interpolation from the project directory,
      # which defaults to this compose file's own folder.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in the environment or .devcontainer/.env (see example.env)}
      
      TRANSFORM_LOCALHOST_TO_DOCKER_INTERNAL: ${TRANSFORM_LOCALHOST_TO_DOCKER_INTERNAL:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - metamcp-network

  postgres:
    image: postgres:16-alpine
    container_name: metamcp-pg-dev
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-metamcp_db}
      POSTGRES_USER: ${POSTGRES_USER:-metamcp_user}
      # Required, no fallback — see the note in the app service above.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment or .devcontainer/.env (see example.env)}
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-9433}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metamcp_user} -d ${POSTGRES_DB:-metamcp_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - metamcp-network

volumes:
  postgres_data_dev:
    driver: local

networks:
  metamcp-network:
    driver: bridge 